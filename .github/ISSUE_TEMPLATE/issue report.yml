name: Fork bug report
description: Report a problem with the independently maintained multi-database fork.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This tracker supports shea786/jellyfin. SQLite and PostgreSQL are supported targets;
        MySQL/MariaDB and SQL Server are experimental. Ask usage questions in this fork's Discussions.
  - type: input
    id: version
    attributes:
      label: Fork release tag or commit
      placeholder: v12.4.0-multidb.preview.1
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Database provider
      options:
        - SQLite
        - PostgreSQL
        - MySQL (experimental)
        - MariaDB (experimental)
        - SQL Server (experimental)
    validations:
      required: true
  - type: input
    id: database-version
    attributes:
      label: Database version
      description: For SQLite, the bundled version is sufficient.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Installation and upgrade path
      description: OS, architecture, image tag/digest, client version, and whether this was a fresh install, upgrade or restore.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, access tokens and private media paths before posting.
      render: text
